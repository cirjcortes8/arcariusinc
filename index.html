<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcarius Inc | Boutique Tax Strategy</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d121c; /* Dark navy background */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }
    /* Logo Container */
    .logo-container {
      width: 100%;
      text-align: center;
      padding: 60px 0 20px 0;
    }
    .logo-container img {
      width: 150px;
      height: 150px;
      display: inline-block;
    }
    /* Hero Section */
    .hero-section {
      background-color: #0d121c;
      padding: 20px 1.5rem 80px 1.5rem;
      text-align: center;
    }
    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1.5rem;
      letter-spacing: 0.15em; /* Spaced out text for ARCARIUS INC */
      text-transform: uppercase;
    }
    .hero-subtitle {
      font-size: 1.25rem;
      color: #8da2b5;
      max-width: 600px;
      margin: 0 auto;
      margin-bottom: 3rem;
    }
    /* Content Section */
    .main-content {
      background-color: #0d121c;
      padding: 0 1.5rem;
    }
    /* Pricing / Service Card */
    .pricing-card {
      background-color: #1a2333; /* Slightly lighter navy for the card */
      border: 2px solid #b59410; /* Gold/Bronze border */
      border-radius: 12px;
      padding: 3rem;
      max-width: 700px;
      margin: 0 auto 60px auto;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 2.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }
    .card-description {
      font-size: 1.15rem;
      color: #8da2b5;
      margin-bottom: 2.5rem;
    }
    .cta-button {
      display: inline-block;
      background-color: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 1rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .cta-button:hover {
      background-color: #ffffff;
      color: #0d121c;
    }
    /* Accreditations Grid */
    .accreditations-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      max-width: 900px;
      margin: 0 auto 80px auto;
    }
    .accreditation-item {
      text-align: center;
    }
    .accreditation-item img {
      width: 100px;
      height: 100px;
      filter: grayscale(100%) brightness(150%); /* For a clean, unified look */
      margin-bottom: 10px;
    }
    /* Footer Section */
    .footer-section {
      background-color: #0d121c;
      padding: 4rem 1.5rem 2rem 1.5rem;
      text-align: center;
      border-top: 1px solid #1a2333;
    }
    .footer-brand {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .footer-legal {
      font-size: 0.85rem;
      color: #5c6c7b;
    }
  </style>
</head>
<body>

  <!-- Logo Container -->
  <div class="logo-container">
    <img src="arcariuslogo.png" alt="Arcarius Inc Logo">
  </div>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <h1 class="hero-title">ARCARIUS INC</h1>
    <p class="hero-subtitle">Boutique S-Corp Strategy & Tax Compliance for Modern Founders</p>
  </section>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    
    <!-- Service / Pricing Card -->
    <div class="pricing-card">
      <h2 class="card-title">Individual & Business Tax Returns</h2>
      <p class="card-description">Entity Formation (LLC, S-Corp, C-Corp)</p>
      <a href="#contact" class="cta-button">Inquire About Rates & Services</a>
    </div>

    <!-- Accreditations Grid -->
    <div class="accreditations-grid">
      <div class="accreditation-item">
        <img src="badge-irs-provider.png" alt="IRS Authorized E-File Provider">
      </div>
      <div class="accreditation-item">
        <img src="badge-cpa.png" alt="Certified Public Accountant">
      </div>
      <div class="accreditation-item">
        <img src="badge-notary.png" alt="Notary Public Official">
      </div>
      <div class="accreditation-item">
        <img src="badge-nvtg.png" alt="NVTG Member">
      </div>
    </div>

  </main>

  <!-- FOOTER SECTION -->
  <footer class="footer-section">
    <div class="footer-brand">Arcarius Inc | Boutique Tax Strategy</div>
    <p class="footer-legal">&copy; 2026 Arcarius Inc. Authorized IRS & NVTG e-file Provider.</p>
  </footer>

</body>
</html>
