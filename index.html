<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcarius Inc</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      background-color: #123746;
    }

    /* TOP HERO SECTION */
    .hero-section {
      background-color: #123746;
      padding: 5rem 1.5rem 4rem;
      text-align: center;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 1.25rem;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      font-weight: 400;
      color: #a0b8c5;
      margin-bottom: 2.5rem;
      letter-spacing: 0.02em;
    }

    /* Primary Header Button */
    .btn-header {
      display: inline-block;
      background-color: #d1d7df;
      color: #123746;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 1rem 2.25rem;
      border-radius: 4px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-header:hover {
      background-color: #ffffff;
      transform: translateY(-1px);
    }

    /* MIDDLE LIGHT SECTION */
    .middle-section {
      background-color: #f6f5f0;
      color: #123746;
      padding: 4rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.5rem;
    }

    /* Pricing / Roadmap Card */
    .card-container {
      background-color: #eaf1e9;
      border-radius: 18px;
      border-top: 6px solid #2e5b28;
      padding: 3rem 2.5rem;
      max-width: 680px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
    }

    .card-title {
      font-size: 2rem;
      font-weight: 700;
      color: #2e5b28;
      margin-bottom: 1.5rem;
    }

    .card-price {
      font-size: 1.35rem;
      color: #123746;
      margin-bottom: 1.25rem;
    }

    .card-price strong {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .card-description {
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .card-description strong {
      color: #123746;
    }

    /* Dark Green CTA Button */
    .btn-roadmap {
      display: inline-block;
      background-color: #2e5b28;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 1.1rem 2.5rem;
      border-radius: 50px;
      box-shadow: 0 4px 12px rgba(46, 91, 40, 0.3);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
