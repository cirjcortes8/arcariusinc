<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcarius Inc | Boutique Tax Strategy</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d121c; /* Dark navy background */
      color: #cbd5e1; /* Softened off-white text */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }
    
    /* Logo Container with Circular Luxury Frame */
    .logo-container {
      width: 100%;
      text-align: center;
      padding: 50px 0 10px 0;
    }
    .logo-frame {
      display: inline-block;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid #000000; /* Black border frame */
      overflow: hidden;
      background-color: #0d121c;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Hero Section */
    .hero-section {
      background-color: #0d121c;
      padding: 20px 1.5rem 60px 1.5rem;
      text-align: center;
    }
    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .hero-subtitle {
      font-size: 1.2rem;
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Content Section */
    .main-content {
      background-color: #0d121c;
      padding: 0 1.5rem 60px 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    /* Pricing / Service Card with Black Border Box */
    .pricing-card {
      background-color: #1a2333;
      border: 2px solid #000000; /* Changed box line color to black */
      border-radius: 24px; /* Smooth rounded corners */
      padding: 3rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(181, 148, 16, 0.15); /* Subtle gold glow behind black border */
    }
    .card-title {
      font-size: 2.25rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 1.5rem;
    }
    .card-description {
      font-size: 1.15rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .cta-button {
      display: inline-block;
      background-color: transparent;
      color: #e2e8f0;
      border: 2px solid #000000; /* Black button border */
      padding: 1rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 30px; /* Fully rounded pill shape */
      margin-top: 1.5rem;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }
    .cta-button:hover {
      background-color: #b59410;
      border-color: #b59410;
      color: #0d121c;
    }

    /* Badges Container */
    .badges-container {
      text-align: center;
      max-width: 800px;
      width: 100%;
    }
    .badges-container img {
      width: 100%;
      max-width: 750px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Footer Section */
    .footer-section {
      background-color: #0d121c;
      padding: 3rem 1.5rem;
      text-align: center;
      border-top: 1px solid #1a2333;
    }
    .footer-brand {
      color: #e2e8f0;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .footer-legal {
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Logo Container -->
  <div class="logo-container">
    <div class="logo-frame">
      <img src="arcariuslogo.png" alt="Arcarius Inc Logo">
    </div>
  </div>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <h1 class="hero-title">ARCARIUS INC</h1>
    <p class="hero-subtitle">Boutique S-Corp Strategy & Tax Compliance for Modern Founders</p>
  </section>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    
    <!-- Service Card -->
    <div class="pricing-card">
      <h2 class="card-title">Individual & Business Tax Returns</h2>
      <p class="card-description">Entity Formation (LLC, S-Corp, C-Corp)</p>
      <p class="card-description">Official Notary Public Services</p>
      <a href="#contact" class="cta-button">Inquire About Rates & Services</a>
    </div>

    <!-- Clean Badges Image Row -->
    <div class="badges-container">
      <img src="badges-row.png" alt="Intuit Academy Specialty Badges">
    </div>

  </main>
